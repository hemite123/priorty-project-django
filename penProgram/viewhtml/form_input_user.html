{% extends "layout/main_layout.html" %}
{% block title %}Form Input Kriteria{% endblock %}
{% load custemp %}
{% block content %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="/procuser" method="POST">
        {% csrf_token %}
        {% if request.session.suc == 0 %}
        <div class="alert alert-danger">
            {{ request.session.msg }}
        </div>
        {% endif %}
        <div class="card" style="width: 100%;">
            <div class="card-header">
                Input User
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label for="id_kriteria">Username</label>
                    <input type="text" id="id_kriteria" class="form-control" name="username"
                        id="exampleFormControlInput1" placeholder="Masukan Username" required>
                </div>
                <div class="form-group">
                    <label for="exampleFormControlInput1">Password</label>
                    <input type="text" class="form-control" name="password" id="exampleFormControlInput1"
                        placeholder="Masukan Nama Kriteria" required>
                </div>
                 <div class="form-group">
                    <label for="exampleFormControlInput1">Nama User</label>
                    <input type="text" class="form-control" name="namau" id="exampleFormControlInput1"
                        placeholder="Masukan Nama Kriteria" required>
                </div>
                <div class="form-group">
                    <label for="exampleFormControlInput1">Nama Perusahaan</label>
                    <input type="text" class="form-control" name="namap" id="exampleFormControlInput1"
                        placeholder="Masukan Nama Kriteria" required>
                </div>
                <div class="form-group">
                    <input type="submit" value="Masukan User" class="btn btn-success">
                </div>
            </div>
        </div>
    </form>

    
</body>

</html>
{% endblock %}
